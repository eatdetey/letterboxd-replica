services:
  user-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${USER_DB_USER}
      POSTGRES_PASSWORD: ${USER_DB_PASSWORD}
      POSTGRES_DB: ${USER_DB_NAME}
    volumes:
      - user-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  user-service:
    build:
      context: ./source/user-service
      dockerfile: Dockerfile
    depends_on:
      user-db:
        condition: service_healthy
    environment:
      - CONFIG_PATH=/etc/user-service/config.yaml
      - AUTH_ACCESS_SECRET=${ACCESS_SECRET}
      - AUTH_REFRESH_SECRET=${REFRESH_SECRET}
      - DB_CONNECTION_STRING=host=user-db port=5432 user=${USER_DB_USER} password=${USER_DB_PASSWORD} dbname=${USER_DB_NAME} sslmode=disable
    volumes:
      - ./source/configs/user-service/config.yaml:/etc/user-service/config.yaml:ro
    restart: unless-stopped

  movie-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${MOVIE_DB_USER}
      POSTGRES_PASSWORD: ${MOVIE_DB_PASSWORD}
      POSTGRES_DB: ${MOVIE_DB_NAME}
    volumes:
      - movie-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  movie-service:
    build:
      context: ./source/movie-service
      dockerfile: Dockerfile
    depends_on:
      movie-db:
        condition: service_healthy
      movie-list-service:
        condition: service_started
    environment:
      - DJANGO_SETTINGS_MODULE=movie_service.settings
      - DB_CONNECTION_STRING=host=movie-db port=5432 user=${MOVIE_DB_USER} password=${MOVIE_DB_PASSWORD} dbname=${MOVIE_DB_NAME} sslmode=disable
      - DB_HOST=movie-db
      - DB_PORT=5432
      - DB_USER=${MOVIE_DB_USER}
      - DB_PASSWORD=${MOVIE_DB_PASSWORD}
      - DB_NAME=${MOVIE_DB_NAME}
      - DB_SSLMODE=disable
      - MOVIE_SERVICE_PORT=50051
      - AUTH_ACCESS_SECRET=${ACCESS_SECRET}
      - MOVIE_LIST_SERVICE_ADDRESS=movie-list-service:50051
      - SECRET_KEY=${MOVIE_SECRET_KEY}
    restart: unless-stopped

  movie-list-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${MOVIE_LIST_DB_USER}
      POSTGRES_PASSWORD: ${MOVIE_LIST_DB_PASSWORD}
      POSTGRES_DB: ${MOVIE_LIST_DB_NAME}
    volumes:
      - movie-list-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  movie-list-service:
    build:
      context: ./source/movie-list-service
      dockerfile: Dockerfile
    depends_on:
      movie-list-db:
        condition: service_healthy
    environment:
      - CONFIG_PATH=/etc/movie-list-service/config.yaml
      - DB_CONNECTION_STRING=host=movie-list-db port=5432 user=${MOVIE_LIST_DB_USER} password=${MOVIE_LIST_DB_PASSWORD} dbname=${MOVIE_LIST_DB_NAME} sslmode=disable
      - AUTH_ACCESS_SECRET=${ACCESS_SECRET}
    volumes:
      - ./source/configs/movie-list-service/config.yaml:/etc/movie-list-service/config.yaml:ro
    restart: unless-stopped

  review-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${REVIEW_DB_USER}
      POSTGRES_PASSWORD: ${REVIEW_DB_PASSWORD}
      POSTGRES_DB: ${REVIEW_DB_NAME}
    volumes:
      - review-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  review-service:
    build:
      context: ./source/review-service
      dockerfile: Dockerfile
    depends_on:
      review-db:
        condition: service_healthy
    environment:
      - DB_CONNECTION_STRING=host=review-db port=5432 user=${REVIEW_DB_USER} password=${REVIEW_DB_PASSWORD} dbname=${REVIEW_DB_NAME} sslmode=disable
      - DB_HOST=review-db
      - DB_PORT=5432
      - DB_USER=${REVIEW_DB_USER}
      - DB_PASSWORD=${REVIEW_DB_PASSWORD}
      - DB_NAME=${REVIEW_DB_NAME}
      - DB_SSLMODE=disable
      - REVIEW_SERVICE_PORT=50051
      - AUTH_ACCESS_SECRET=${ACCESS_SECRET:-default_access_secret}
      - MOVIE_SERVICE_ADDRESS=movie-service:50051
      - SECRET_KEY=${REVIEW_SECRET_KEY}
    restart: unless-stopped

  api-gateway:
    build:
      context: ./source/api-gateway
      dockerfile: Dockerfile
    depends_on:
      - user-service
      - movie-service
      - movie-list-service
      - review-service
    environment:
      - CONFIG_PATH=/etc/api-gateway/config.yaml
      - AUTH_ACCESS_SECRET=${ACCESS_SECRET:-default_access_secret}
      - USER_SERVICE_ADDRESS=user-service:50051
      - MOVIE_SERVICE_ADDRESS=movie-service:50051
      - MOVIE_LIST_SERVICE_ADDRESS=movie-list-service:50051
    volumes:
      - ./source/configs/api-gateway/config.yaml:/etc/api-gateway/config.yaml:ro
    restart: unless-stopped

  frontend:
    build:
      context: ./source/frontend
      dockerfile: Dockerfile
    depends_on:
      - api-gateway
    environment:
      - API_URL=http://api-gateway:8080
    ports:
      - "80:80"
    restart: unless-stopped

volumes:
  user-db-data:
  movie-db-data:
  movie-list-db-data:
  review-db-data:
