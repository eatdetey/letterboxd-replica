services:
  user-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - user-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  user-service:
    build:
      context: ./source/user-service
      dockerfile: Dockerfile
    depends_on:
      user-db:
        condition: service_healthy
    environment:
      - CONFIG_PATH=/etc/user-service/config.yaml
      - AUTH_ACCESS_SECRET=${ACCESS_SECRET:-default_access_secret}
      - AUTH_REFRESH_SECRET=${REFRESH_SECRET:-default_refresh_secret}
      - DB_CONNECTION_STRING=postgres://postgres:postgres@user-db:5432/postgres?sslmode=disable
    volumes:
      - ./source/configs/user-service/config.yaml:/etc/user-service/config.yaml:ro
    ports:
      - "50051:50051"
    restart: unless-stopped

  movie-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5433:5432"
    volumes:
      - movie-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  movie-service:
    build:
      context: ./source/movie-service
      dockerfile: Dockerfile
    depends_on:
      movie-db:
        condition: service_healthy
      movie-list-service:
        condition: service_started
    environment:
      - DJANGO_SETTINGS_MODULE=movie_service.settings
      - DB_CONNECTION_STRING=postgres://postgres:postgres@movie-db:5432/postgres?sslmode=disable
      - MOVIE_SERVICE_PORT=50051
      - AUTH_ACCESS_SECRET=${ACCESS_SECRET:-default_access_secret}
      - MOVIE_LIST_SERVICE_ADDRESS=movie-list-service:50051
    ports:
      - "50052:50051"
    restart: unless-stopped

  movie-list-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5434:5432"
    volumes:
      - movie-list-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  movie-list-service:
    build:
      context: ./source/movie-list-service
      dockerfile: Dockerfile
    depends_on:
      movie-list-db:
        condition: service_healthy
    environment:
      - CONFIG_PATH=/etc/movie-list-service/config.yaml
      - DB_CONNECTION_STRING=postgres://postgres:postgres@movie-list-db:5432/postgres?sslmode=disable
      - AUTH_ACCESS_SECRET=${ACCESS_SECRET:-default_access_secret}
    volumes:
      - ./source/configs/movie-list-service/config.yaml:/etc/movie-list-service/config.yaml:ro
    ports:
      - "50053:50051"
    restart: unless-stopped

  review-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5435:5432"
    volumes:
      - review-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  review-service:
    build:
      context: ./source/review-service
      dockerfile: Dockerfile
    depends_on:
      review-db:
        condition: service_healthy
    environment:
      - CONFIG_PATH=/etc/review-service/config.yaml
      - DB_CONNECTION_STRING=postgres://postgres:postgres@review-db:5432/postgres?sslmode=disable
      - REVIEW_SERVICE_PORT=50051
      - AUTH_ACCESS_SECRET=${ACCESS_SECRET:-default_access_secret}
      - MOVIE_SERVICE_ADDRESS=movie-service:50051
    volumes:
      - ./source/configs/review-service/config.yaml:/etc/review-service/config.yaml:ro
    ports:
      - "50054:50051"
    restart: unless-stopped

  api-gateway:
    build:
      context: ./source/api-gateway
      dockerfile: Dockerfile
    depends_on:
      - user-service
      - movie-service
      - movie-list-service
      - review-service
    environment:
      - CONFIG_PATH=/etc/api-gateway/config.yaml
      - AUTH_ACCESS_SECRET=${ACCESS_SECRET:-default_access_secret}
      - USER_SERVICE_ADDRESS=user-service:50051
      - MOVIE_SERVICE_ADDRESS=movie-service:50051
      - REVIEW_SERVICE_ADDRESS=review-service:50051
      - MOVIE_LIST_SERVICE_ADDRESS=movie-list-service:50051
    volumes:
      - ./source/configs/api-gateway/config.yaml:/etc/api-gateway/config.yaml:ro
    ports:
      - "8080:8080"
    restart: unless-stopped

  frontend:
    image: node:20-alpine
    working_dir: /app
    depends_on:
      - api-gateway
    environment:
      - VITE_API_BASE_URL=/api
      - VITE_API_GATEWAY_URL=http://api-gateway:8080
      - VITE_USE_MOCKS=false
      - VITE_USE_MOCKS_MOVIES=false
      - VITE_USE_MOCKS_REVIEWS=false
      - VITE_USE_MOCKS_PLAYLISTS=false
    volumes:
      - ./source/frontend:/app
      - frontend-node-modules:/app/node_modules
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    restart: unless-stopped

volumes:
  user-db-data:
  movie-db-data:
  movie-list-db-data:
  review-db-data:
  frontend-node-modules:
