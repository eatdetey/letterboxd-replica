syntax = "proto3";

package movie;

service MovieService {
  rpc GetMovie (GetMovieRequest) returns (MovieResponse);
  rpc ListMovies (ListMoviesRequest) returns (ListMoviesResponse);
  rpc SearchMovies (SearchMoviesRequest) returns (ListMoviesResponse);
}

message GetMovieRequest {
  int32 id = 1;
}

message ListMoviesRequest {
  int32 limit = 1;
  int32 offset = 2;
}

message SearchMoviesRequest {
  string query = 1;
  int32 limit = 2;
  int32 offset = 3;
}

message MovieResponse {
  int32 id = 1;
  string title = 2;
  string original_title = 3;
  string description = 4;
  string release_date = 5;
  int32 duration_minutes = 6;
  string country = 7;
  string age_rating = 8;
  repeated string genres = 9;
  repeated CastResponse cast = 10;
}

message CastResponse {
  string person_name = 1;
  string role_type = 2;
  string character_name = 3;
}

message ListMoviesResponse {
  repeated MovieResponse movies = 1;
}
