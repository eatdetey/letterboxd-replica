version: v1

plugins:
  - name: go
    out: api-gateway/gen/go
    opt:
      - paths=source_relative
      - Mmovie/v1/movie.proto=github.com/eatdetey/letterboxd-replica/source/api-gateway/gen/go/movie/v1
  - name: go-grpc
    out: api-gateway/gen/go
    opt:
      - paths=source_relative
      - Mmovie/v1/movie.proto=github.com/eatdetey/letterboxd-replica/source/api-gateway/gen/go/movie/v1
