syntax = "proto3";

package movielist.v1;

option go_package = "github.com/eatdetey/letterboxd-replica/source/movie-list-service/gen/go/movielist/v1;movielist";

// MovieListService provides methods for managing playlists and filtering movies by playlists.
service MovieListService {
    // FilterMoviesByPlaylist filters a list of candidate movie IDs by membership in a specific playlist.
    rpc FilterMoviesByPlaylist(FilterRequest) returns (MovieIdsResponse);

    // GetPlaylistsForMovie returns all playlists containing a specific movie for a user.
    rpc GetPlaylistsForMovie(MoviePlaylistRequest) returns (PlaylistsResponse);

    // GetPlaylistsForUser returns all playlists for a specific user.
    rpc GetPlaylistsForUser(UserPlaylistsRequest) returns (UserPlaylistsResponse);

    // CreatePlaylist creates a new playlist for a user.
    rpc CreatePlaylist(CreatePlaylistRequest) returns (PlaylistResponse);

    // RenamePlaylist renames an existing playlist.
    rpc RenamePlaylist(RenamePlaylistRequest) returns (PlaylistResponse);

    // DeletePlaylist deletes a playlist.
    rpc DeletePlaylist(DeletePlaylistRequest) returns (Empty);

    // AddMovieToPlaylist adds a movie to a playlist.
    rpc AddMovieToPlaylist(AddMovieRequest) returns (Empty);

    // RemoveMovieFromPlaylist removes a movie from a playlist.
    rpc RemoveMovieFromPlaylist(RemoveMovieRequest) returns (Empty);

    // GetPlaylistMovies returns all movies in a playlist.
    rpc GetPlaylistMovies(GetPlaylistMoviesRequest) returns (PlaylistMoviesResponse);
}

// FilterRequest is used to filter candidate movies by playlist membership.
message FilterRequest {
    string user_id = 1;
    string playlist_id = 2;
    repeated string candidate_movie_ids = 3;
}

// MovieIdsResponse returns a list of movie IDs.
message MovieIdsResponse {
    repeated string movie_ids = 1;
}

// MoviePlaylistRequest is used to get playlists for a specific movie.
message MoviePlaylistRequest {
    string user_id = 1;
    string movie_id = 2;
}

// PlaylistInfo contains basic information about a playlist.
message PlaylistInfo {
    string id = 1;
    string name = 2;
    int32 movies_count = 3;
}

// PlaylistsResponse returns a list of playlists.
message PlaylistsResponse {
    repeated PlaylistInfo playlists = 1;
}

// UserPlaylistsRequest is used to get all playlists for a user.
message UserPlaylistsRequest {
    string user_id = 1;
}

// UserPlaylistsResponse returns all playlists for a user.
message UserPlaylistsResponse {
    repeated PlaylistInfo playlists = 1;
}

// CreatePlaylistRequest is used to create a new playlist.
message CreatePlaylistRequest {
    string user_id = 1;
    string name = 2;
}

// PlaylistResponse returns playlist information.
message PlaylistResponse {
    string id = 1;
    string user_id = 2;
    string name = 3;
    int32 movies_count = 4;
}

// RenamePlaylistRequest is used to rename a playlist.
message RenamePlaylistRequest {
    string playlist_id = 1;
    string new_name = 2;
}

// DeletePlaylistRequest is used to delete a playlist.
message DeletePlaylistRequest {
    string playlist_id = 1;
}

// AddMovieRequest is used to add a movie to a playlist.
message AddMovieRequest {
    string playlist_id = 1;
    string movie_id = 2;
}

// RemoveMovieRequest is used to remove a movie from a playlist.
message RemoveMovieRequest {
    string playlist_id = 1;
    string movie_id = 2;
}

// GetPlaylistMoviesRequest is used to get all movies in a playlist.
message GetPlaylistMoviesRequest {
    string playlist_id = 1;
    int32 limit = 2;
    int32 offset = 3;
}

// PlaylistMoviesResponse returns movies in a playlist.
message PlaylistMoviesResponse {
    repeated string movie_ids = 1;
    int32 total = 2;
}

// Empty message for methods that don't return data.
message Empty {}
