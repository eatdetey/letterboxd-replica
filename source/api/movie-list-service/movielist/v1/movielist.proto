syntax = "proto3";

package movielist.v1;

option go_package = "github.com/eatdetey/letterboxd-replica/source/movie-list-service/gen/go/movielist/v1;movielist";

service MovieListService {
    rpc FilterMoviesByPlaylist(FilterMoviesByPlaylistRequest) returns (FilterMoviesByPlaylistResponse);

    rpc GetPlaylistsForMovie(GetPlaylistsForMovieRequest) returns (GetPlaylistsForMovieResponse);

    rpc GetPlaylistsForUser(GetPlaylistsForUserRequest) returns (GetPlaylistsForUserResponse);

    rpc CreatePlaylist(CreatePlaylistRequest) returns (CreatePlaylistResponse);

    rpc RenamePlaylist(RenamePlaylistRequest) returns (RenamePlaylistResponse);

    rpc DeletePlaylist(DeletePlaylistRequest) returns (DeletePlaylistResponse);

    rpc AddMovieToPlaylist(AddMovieToPlaylistRequest) returns (AddMovieToPlaylistResponse);

    rpc RemoveMovieFromPlaylist(RemoveMovieFromPlaylistRequest) returns (RemoveMovieFromPlaylistResponse);

    rpc GetPlaylistMovies(GetPlaylistMoviesRequest) returns (GetPlaylistMoviesResponse);
}

message FilterMoviesByPlaylistRequest {
    string playlist_id = 1;
    repeated string candidate_movie_ids = 2;
}

message FilterMoviesByPlaylistResponse {
    repeated string movie_ids = 1;
}

message GetPlaylistsForMovieRequest {
    string movie_id = 1;
}

message PlaylistInfo {
    string id = 1;
    string name = 2;
    int32 movies_count = 3;
}

message GetPlaylistsForMovieResponse {
    repeated PlaylistInfo playlists = 1;
}

message GetPlaylistsForUserRequest {}

message GetPlaylistsForUserResponse {
    repeated PlaylistInfo playlists = 1;
}

message CreatePlaylistRequest {
    string name = 1;
}

message CreatePlaylistResponse {
    string id = 1;
    string user_id = 2;
    string name = 3;
    int32 movies_count = 4;
}

message RenamePlaylistRequest {
    string playlist_id = 1;
    string new_name = 2;
}

message RenamePlaylistResponse {
    string id = 1;
    string user_id = 2;
    string name = 3;
    int32 movies_count = 4;
}

message DeletePlaylistRequest {
    string playlist_id = 1;
}

message DeletePlaylistResponse {}

message AddMovieToPlaylistRequest {
    string playlist_id = 1;
    string movie_id = 2;
}

message AddMovieToPlaylistResponse {}

message RemoveMovieFromPlaylistRequest {
    string playlist_id = 1;
    string movie_id = 2;
}

message RemoveMovieFromPlaylistResponse {}

message GetPlaylistMoviesRequest {
    string playlist_id = 1;
    int32 limit = 2;
    int32 offset = 3;
}

message GetPlaylistMoviesResponse {
    repeated string movie_ids = 1;
    int32 total = 2;
}
