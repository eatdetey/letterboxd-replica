http:
  addr: ":8080"
  cors:
    allow_origins:
      - "http://localhost:5173"
    allow_methods:
      - "GET"
      - "POST"
      - "PUT"
      - "PATCH"
      - "DELETE"
      - "OPTIONS"
    allow_headers:
      - "Accept"
      - "Authorization"
      - "Content-Type"
    expose_headers: []
    allow_credentials: true
    max_age: 600
